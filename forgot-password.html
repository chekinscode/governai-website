<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — GovernAI</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317B6C4'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='18' fill='%2306222A'%3EG%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<nav class="site-nav"><div class="nav-inner"><a href="index.html" class="nav-logo">Govern<span class="accent-text">AI</span><span class="dot"></span></a><a href="login.html" class="btn btn-ghost btn-sm">Log In</a></div></nav>
<main id="main-content">
  <div class="card auth-card reveal in">
    <h1>Reset your password</h1>
    <p>We'll email you a reset link.</p>
    <form class="mt-24" onsubmit="event.preventDefault(); this.innerHTML='&lt;p&gt;Check your inbox — a reset link is on its way.&lt;/p&gt;';">
      <div class="form-field"><label for="email">Work email</label><input id="email" type="email" required autocomplete="email"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Link</button>
    </form>
    <p class="mt-24" style="text-align:center; font-size:0.88rem;"><a href="login.html" class="text-accent">← Back to log in</a></p>
  </div>
</main>
<script src="js/shared.js"></script>
</body>
</html>
