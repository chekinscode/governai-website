<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — GovernAI</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317B6C4'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='18' fill='%2306222A'%3EG%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<nav class="site-nav"><div class="nav-inner"><a href="index.html" class="nav-logo">Govern<span class="accent-text">AI</span><span class="dot"></span></a><a href="signup.html" class="btn btn-outline btn-sm">Create Account</a></div></nav>
<main id="main-content">
  <div class="card auth-card reveal in">
    <h1>Welcome back</h1>
    <p>Log in with your company identity provider, or your email.</p>
    <div class="social-auth-row mt-24">
      <button type="button" class="btn btn-outline" onclick="window.location.href='console.html'">Continue with Okta</button>
      <button type="button" class="btn btn-outline" onclick="window.location.href='console.html'">Continue with Microsoft Entra ID</button>
      <button type="button" class="btn btn-outline" onclick="window.location.href='console.html'">Continue with Google Workspace</button>
    </div>
    <div class="auth-divider">or</div>
    <form action="console.html" method="GET">
      <div class="form-field"><label for="email">Work email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="form-field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
    </form>
    <p class="mt-24" style="text-align:center; font-size:0.88rem;"><a href="forgot-password.html" class="text-accent">Forgot your password?</a></p>
    <p class="mt-16" style="text-align:center; font-size:0.88rem;">Don't have an account? <a href="signup.html" class="text-accent">Start a free trial</a></p>
  </div>
</main>
<script src="js/shared.js"></script>
</body>
</html>
