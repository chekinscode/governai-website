<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Free Trial — GovernAI</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317B6C4'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='18' fill='%2306222A'%3EG%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<nav class="site-nav"><div class="nav-inner"><a href="index.html" class="nav-logo">Govern<span class="accent-text">AI</span><span class="dot"></span></a><a href="login.html" class="btn btn-ghost btn-sm">Log In</a></div></nav>
<main id="main-content">
  <div class="card auth-card reveal in">
    <h1>Start your free trial</h1>
    <p>14 days, full Professional-tier features, no credit card required.</p>
    <form action="console.html" method="GET" class="mt-24">
      <div class="form-field"><label for="name">Full name</label><input id="name" type="text" required autocomplete="name"></div>
      <div class="form-field"><label for="email">Work email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="form-field"><label for="company">Company</label><input id="company" type="text" required autocomplete="organization"></div>
      <div class="form-field"><label for="password">Password</label><input id="password" type="password" required autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
    </form>
    <p class="mt-24" style="text-align:center; font-size:0.88rem;">Already have an account? <a href="login.html" class="text-accent">Log in</a></p>
  </div>
</main>
<script src="js/shared.js"></script>
</body>
</html>
